```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #fff;
    }

    .container {
      width: 90%;
      max-width: 780px;
      margin: 30px auto;
      padding: 28px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-size: 22px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 18px;
    }

    button {
      width: 100%;
      height: 52px;
      margin-top: 22px;
      border: none;
      border-radius: 5px;
      background: #087ff5;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    button:hover {
      background: #066bd0;
    }

    .mensagem {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 500px;
      background: #1000ee;
      color: white;
      text-align: center;
    }

    .mensagem h1 {
      font-size: 28px;
    }

    .voltar {
      width: 155px;
      background: #ddd;
      color: white;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <main class="container" id="paginaCadastro">
    <h1>Cadastro de Usuário</h1>

    <form id="formCadastro">
      <label for="nome">Nome Completo:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="nascimento">Data de Nascimento:</label>
      <input type="date" id="nascimento" name="nascimento" required>

      <label for="cpf">CPF:</label>
      <input
        type="text"
        id="cpf"
        name="cpf"
        placeholder="Apenas números (11 dígitos)"
        maxlength="11"
        pattern="[0-9]{11}"
        inputmode="numeric"
        required
      >

      <label for="genero">Gênero:</label>
      <select id="genero" name="genero" required>
        <option value="">Selecione...</option>
        <option value="feminino">Feminino</option>
        <option value="masculino">Masculino</option>
        <option value="outro">Outro</option>
      </select>

      <label for="telefone">Telefone:</label>
      <input
        type="tel"
        id="telefone"
        name="telefone"
        placeholder="(XX) XXXXX-XXXX"
        required
      >

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="cidade">Cidade:</label>
      <input type="text" id="cidade" name="cidade" required>

      <label for="uf">UF (Estado):</label>
      <select id="uf" name="uf" required>
        <option value="">Selecione</option>
        <option>AC</option>
        <option>AL</option>
        <option>AP</option>
        <option>AM</option>
        <option>BA</option>
        <option>CE</option>
        <option>DF</option>
        <option>ES</option>
        <option>GO</option>
        <option>MA</option>
        <option>MT</option>
        <option>MS</option>
        <option>MG</option>
        <option>PA</option>
        <option>PB</option>
        <option>PR</option>
        <option>PE</option>
        <option>PI</option>
        <option>RJ</option>
        <option>RN</option>
        <option>RS</option>
        <option>RO</option>
        <option>RR</option>
        <option>SC</option>
        <option>SP</option>
        <option>SE</option>
        <option>TO</option>
      </select>

      <button type="submit">Cadastrar</button>
    </form>
  </main>

  <main class="container mensagem" id="paginaSucesso" hidden>
    <h1>O SENAI AGRADECE SUA INSCRIÇÃO!!!</h1>
    <button class="voltar" id="btnVoltar" type="button">Voltar</button>
  </main>

  <script>
    const form = document.getElementById("formCadastro");
    const paginaCadastro = document.getElementById("paginaCadastro");
    const paginaSucesso = document.getElementById("paginaSucesso");
    const btnVoltar = document.getElementById("btnVoltar");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      paginaCadastro.hidden = true;
      paginaSucesso.hidden = false;
    });

    btnVoltar.addEventListener("click", function() {
      paginaSucesso.hidden = true;
      paginaCadastro.hidden = false;
    });

    document.getElementById("cpf").addEventListener("input", function() {
      this.value = this.value.replace(/\D/g, "").slice(0, 11);
    });
  </script>
</body>
</html>
